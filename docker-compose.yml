version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: qa_mgmt_postgres
    restart: always
    environment:
      POSTGRES_DB: qa_mgmt_db
      POSTGRES_USER: qa_mgmt_user
      POSTGRES_PASSWORD: qa_mgmt_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_mgmt_user -d qa_mgmt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qa_mgmt_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
