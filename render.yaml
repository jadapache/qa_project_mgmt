services:
  - type: web
    name: pmqa-copilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PMQA_FRONTEND_URL
        sync: false
      - key: PMQA_BACKEND_URL
        sync: false
      - key: PMQA_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: JIRA_CLIENT_ID
        sync: false
      - key: JIRA_CLIENT_SECRET
        sync: false
      - key: JIRA_REDIRECT_URI
        sync: false
